[project]
name = "swallow-guardian"
version = "0.1.0"
description = "삼킴지킴이 AI 백엔드, 비임상 연구용 프로토타입"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "swallow-shared",
    "swallow-server",
    "swallow-ml",
    "swallow-tools",
]

[tool.uv.workspace]
members = ["shared", "server", "ml", "tools"]

[tool.uv.sources]
swallow-shared = { workspace = true }
swallow-server = { workspace = true }
swallow-ml = { workspace = true }
swallow-tools = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["shared/tests", "server/tests"]
pythonpath = ["server/tests"]
addopts = "-q"
