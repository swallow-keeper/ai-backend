openapi: 3.1.0
info:
  title: 삼킴지킴이
  version: 0.1.0
  description: 연구용 음성 변화 분석 API. 흡인을 진단하지 않습니다. 기본 앱은 이 API 대신 온디바이스 분석을 사용하며, 서버
    모드는 개발 환경에서 명시적으로 선택합니다.
paths:
  /sessions:
    post:
      summary: Start Session
      operationId: start_session_sessions_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SessionIn'
              - type: 'null'
              title: Payload
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Sessions
      operationId: list_sessions_sessions_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionSummaryOut'
                title: Response List Sessions Sessions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/end:
    post:
      summary: End Session
      operationId: end_session_sessions__session_id__end_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/baseline:
    post:
      summary: Register Baseline
      operationId: register_baseline_sessions__session_id__baseline_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_register_baseline_sessions__session_id__baseline_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaselineOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/swallow-events:
    post:
      summary: Report Swallow
      operationId: report_swallow_sessions__session_id__swallow_events_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwallowEventIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwallowEventOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_id}/voice-clip:
    post:
      summary: Submit Voice
      operationId: submit_voice_events__event_id__voice_clip_post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submit_voice_events__event_id__voice_clip_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_id}/skip:
    post:
      summary: Skip Voice
      operationId: skip_voice_events__event_id__skip_post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /events/{event_id}/resolve:
    post:
      summary: Resolve Event
      operationId: resolve_event_events__event_id__resolve_post
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
          title: Event Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterventionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /me/consents:
    post:
      summary: Record Consent
      operationId: record_consent_me_consents_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /me/data:
    delete:
      summary: Delete Data
      operationId: delete_data_me_data_delete
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /home/summary:
    get:
      summary: Home Summary
      operationId: home_summary_home_summary_get
      parameters:
      - name: tz
        in: query
        required: false
        schema:
          type: string
          default: Asia/Seoul
          title: Tz
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeSummaryOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /sessions/{session_id}/report:
    get:
      summary: Session Report
      operationId: session_report_sessions__session_id__report_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionReportOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /reports/trend:
    get:
      summary: Trend Report
      operationId: trend_report_reports_trend_get
      parameters:
      - name: period
        in: query
        required: false
        schema:
          enum:
          - day
          - week
          - month
          type: string
          default: day
          title: Period
      - name: tz
        in: query
        required: false
        schema:
          type: string
          default: Asia/Seoul
          title: Tz
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalysisOut:
      properties:
        result_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Id
        event_id:
          type: string
          title: Event Id
        clip_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Clip Id
        state:
          type: string
          title: State
        phase:
          type: string
          title: Phase
        change_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Change Score
        ewma_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Ewma Score
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        model_version:
          type: string
          title: Model Version
        tau1:
          anyOf:
          - type: number
          - type: 'null'
          title: Tau1
        tau2:
          anyOf:
          - type: number
          - type: 'null'
          title: Tau2
        message_key:
          type: string
          title: Message Key
      type: object
      required:
      - event_id
      - state
      - phase
      - model_version
      - message_key
      title: AnalysisOut
    BaselineOut:
      properties:
        stable:
          type: boolean
          title: Stable
        passed_count:
          type: integer
          title: Passed Count
        spread:
          type: number
          title: Spread
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        model_version:
          type: string
          title: Model Version
        quality_flag:
          type: string
          title: Quality Flag
      type: object
      required:
      - stable
      - passed_count
      - spread
      - reason_codes
      - warnings
      - model_version
      - quality_flag
      title: BaselineOut
    Body_register_baseline_sessions__session_id__baseline_post:
      properties:
        clip_1:
          type: string
          contentMediaType: application/octet-stream
          title: Clip 1
        clip_2:
          type: string
          contentMediaType: application/octet-stream
          title: Clip 2
        clip_3:
          type: string
          contentMediaType: application/octet-stream
          title: Clip 3
      type: object
      required:
      - clip_1
      - clip_2
      - clip_3
      title: Body_register_baseline_sessions__session_id__baseline_post
    Body_submit_voice_events__event_id__voice_clip_post:
      properties:
        clip:
          type: string
          contentMediaType: application/octet-stream
          title: Clip
      type: object
      required:
      - clip
      title: Body_submit_voice_events__event_id__voice_clip_post
    ConsentIn:
      properties:
        item:
          type: string
          enum:
          - voice_analysis
          - research_optional
          title: Item
        granted:
          type: boolean
          title: Granted
        guardian:
          type: boolean
          title: Guardian
          default: false
      type: object
      required:
      - item
      - granted
      title: ConsentIn
    ConsentOut:
      properties:
        id:
          type: string
          title: Id
        item:
          type: string
          title: Item
        granted:
          type: boolean
          title: Granted
        guardian:
          type: boolean
          title: Guardian
        recorded_at:
          type: string
          format: date-time
          title: Recorded At
      type: object
      required:
      - id
      - item
      - granted
      - guardian
      - recorded_at
      title: ConsentOut
    DeletedOut:
      properties:
        deleted:
          type: boolean
          title: Deleted
      type: object
      required:
      - deleted
      title: DeletedOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HomeSummaryOut:
      properties:
        meal_count:
          type: integer
          title: Meal Count
        swallow_count:
          type: integer
          title: Swallow Count
        caution_count:
          type: integer
          title: Caution Count
        recent:
          items:
            $ref: '#/components/schemas/SessionSummaryOut'
          type: array
          title: Recent
      type: object
      required:
      - meal_count
      - swallow_count
      - caution_count
      - recent
      title: HomeSummaryOut
    InterventionOut:
      properties:
        event_id:
          type: string
          title: Event Id
        alerted_at:
          type: string
          format: date-time
          title: Alerted At
        resolved_at:
          type: string
          format: date-time
          title: Resolved At
        duration_seconds:
          type: number
          title: Duration Seconds
        phase:
          type: string
          title: Phase
      type: object
      required:
      - event_id
      - alerted_at
      - resolved_at
      - duration_seconds
      - phase
      title: InterventionOut
    ReportEventOut:
      properties:
        id:
          type: string
          title: Id
        detected_at:
          type: string
          format: date-time
          title: Detected At
        trigger:
          type: string
          title: Trigger
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration Seconds
        reason_codes:
          items:
            type: string
          type: array
          title: Reason Codes
        spectrogram_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Spectrogram Url
        baseline_spectrogram_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Baseline Spectrogram Url
      type: object
      required:
      - id
      - detected_at
      - trigger
      - state
      - duration_seconds
      - reason_codes
      title: ReportEventOut
    SessionIn:
      properties:
        meal:
          anyOf:
          - type: string
            enum:
            - breakfast
            - lunch
            - dinner
            - snack
          - type: 'null'
          title: Meal
      type: object
      title: SessionIn
    SessionOut:
      properties:
        id:
          type: string
          title: Id
        meal:
          anyOf:
          - type: string
          - type: 'null'
          title: Meal
        phase:
          type: string
          title: Phase
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
      type: object
      required:
      - id
      - phase
      - started_at
      title: SessionOut
    SessionReportOut:
      properties:
        session:
          $ref: '#/components/schemas/SessionSummaryOut'
        baseline_quality_flag:
          anyOf:
          - type: string
          - type: 'null'
          title: Baseline Quality Flag
        model_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Version
        unanalyzable_count:
          type: integer
          title: Unanalyzable Count
        skipped_count:
          type: integer
          title: Skipped Count
        no_response_count:
          type: integer
          title: No Response Count
        events:
          items:
            $ref: '#/components/schemas/ReportEventOut'
          type: array
          title: Events
        disclaimer:
          type: string
          title: Disclaimer
      type: object
      required:
      - session
      - baseline_quality_flag
      - model_version
      - unanalyzable_count
      - skipped_count
      - no_response_count
      - events
      - disclaimer
      title: SessionReportOut
    SessionSummaryOut:
      properties:
        id:
          type: string
          title: Id
        meal:
          anyOf:
          - type: string
          - type: 'null'
          title: Meal
        phase:
          type: string
          title: Phase
        started_at:
          type: string
          format: date-time
          title: Started At
        ended_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Ended At
        duration_seconds:
          type: number
          title: Duration Seconds
        swallow_count:
          type: integer
          title: Swallow Count
        caution_count:
          type: integer
          title: Caution Count
        no_change_count:
          type: integer
          title: No Change Count
      type: object
      required:
      - id
      - phase
      - started_at
      - duration_seconds
      - swallow_count
      - caution_count
      - no_change_count
      title: SessionSummaryOut
    SwallowEventIn:
      properties:
        trigger:
          type: string
          enum:
          - auto
          - manual
          - periodic
          title: Trigger
        detected_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Detected At
        camera_confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Camera Confidence
        request_voice:
          type: boolean
          title: Request Voice
          default: true
      type: object
      required:
      - trigger
      title: SwallowEventIn
    SwallowEventOut:
      properties:
        id:
          type: string
          title: Id
        session_id:
          type: string
          title: Session Id
        trigger:
          type: string
          title: Trigger
        camera_confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Camera Confidence
        phase:
          type: string
          title: Phase
        prompt:
          type: boolean
          title: Prompt
        merged:
          type: boolean
          title: Merged
      type: object
      required:
      - id
      - session_id
      - trigger
      - camera_confidence
      - phase
      - prompt
      - merged
      title: SwallowEventOut
    TrendOut:
      properties:
        period:
          type: string
          enum:
          - day
          - week
          - month
          title: Period
        points:
          items:
            $ref: '#/components/schemas/TrendPointOut'
          type: array
          title: Points
      type: object
      required:
      - period
      - points
      title: TrendOut
    TrendPointOut:
      properties:
        label:
          type: string
          title: Label
        swallow_count:
          type: integer
          title: Swallow Count
        no_change_ratio:
          anyOf:
          - type: number
          - type: 'null'
          title: No Change Ratio
        caution_count:
          type: integer
          title: Caution Count
      type: object
      required:
      - label
      - swallow_count
      - no_change_ratio
      - caution_count
      title: TrendPointOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
- bearerAuth: []
