[project]
name = "swallow-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "swallow-server",
    "httpx>=0.27",
    "numpy>=2.1",
]

[project.scripts]
swallow-mock = "swallow_tools.mock_server:main"
swallow-replay = "swallow_tools.replay_client:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
