[project]
name = "swallow-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "swallow-shared",
    "alembic>=1.14",
    "cryptography>=43",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
